server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_platform
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=erp_user
spring.datasource.password=erp@2024secure

# JPA / Hibernate
# Use 'create' on first run to generate all tables, then change to 'validate'
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Controllers serialize JPA entities directly; keep the session open during view
# rendering so lazy @OneToMany collections initialize instead of throwing
# LazyInitializationException (ERR_010) during Jackson serialization.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=ErpHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway — enable for production migrations
spring.flyway.enabled=false

# JWT
app.jwt.secret=erp-platform-super-secret-jwt-key-2024-must-be-at-least-256-bits-long-secure
app.jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# SpringDoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
