server.port=8080

# H2 In-Memory Database (development)
# NON_KEYWORDS: value, day and hour are reserved in H2 but ordinary identifiers in
# Postgres, which is what this runs on in production. Without this the local database
# refuses to create salary_components, hr_working_days and report_schedules, and the
# application then fails to start on a seeder that reads one of them.
spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=PostgreSQL;NON_KEYWORDS=VALUE,DAY,HOUR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
# Controllers serialize JPA entities directly; keep the session open during
# view rendering so lazy @OneToMany collections initialize instead of throwing
# LazyInitializationException (ERR_010) during Jackson serialization.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Flyway (disabled for H2 dev; enable for PostgreSQL)
spring.flyway.enabled=false

# JWT
app.jwt.secret=erp-platform-super-secret-jwt-key-2024-must-be-at-least-256-bits-long-secure
app.jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# SpringDoc / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# AI Assistant — which LLM backs it: gemini | claude | openai-compatible
ai.provider=${AI_PROVIDER:gemini}
ai.max-tool-rounds=${AI_MAX_TOOL_ROUNDS:3}

# Google AI Studio (free tier — Flash models only, Pro is billed)
# Free key: https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:8192}

# Anthropic Claude AI (only needed when ai.provider=claude)
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}

# Email / SMTP (configure via environment variables or override in application-*.properties)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@erp.local}
app.mail.enabled=${MAIL_ENABLED:false}

# SMS / WhatsApp (marketing campaigns) — provider NONE simulates/logs sends.
# Set sms.provider=TWILIO and the credentials below to send for real.
sms.provider=${SMS_PROVIDER:NONE}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from=${TWILIO_SMS_FROM:}
sms.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Logging
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Single Sign-On (OIDC) ─────────────────────────────────────────────────
app.sso.enabled=${SSO_ENABLED:false}
app.sso.auto-provision=${SSO_AUTO_PROVISION:true}
app.sso.require-email-verified=${SSO_REQUIRE_EMAIL_VERIFIED:true}
app.sso.default-role=${SSO_DEFAULT_ROLE:STAFF}
app.sso.default-tenant-id=${SSO_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
app.sso.providers.google.client-id=${SSO_GOOGLE_CLIENT_ID:}
app.sso.providers.google.issuer=${SSO_GOOGLE_ISSUER:https://accounts.google.com}
app.sso.providers.google.jwks-uri=${SSO_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
app.sso.providers.microsoft.client-id=${SSO_MS_CLIENT_ID:}
app.sso.providers.microsoft.issuer=${SSO_MS_ISSUER:}
app.sso.providers.microsoft.jwks-uri=${SSO_MS_JWKS_URI:}

# ── Satellite & IoT field data ────────────────────────────────────────────
# SIMULATED generates plausible readings so the dashboards work without a provider.
# LIVE pulls real weather and soil from Open-Meteo (free, no key) using each field's coordinates;
# fields with no coordinates set, and any call that fails, fall back to simulation individually.
fieldiot.mode=${FIELDIOT_MODE:SIMULATED}
fieldiot.weather.url=${FIELDIOT_WEATHER_URL:https://api.open-meteo.com/v1/forecast}
# NDVI/canopy vigour needs a satellite imagery provider; blank means that part stays simulated.
fieldiot.satellite.url=${FIELDIOT_SATELLITE_URL:}
fieldiot.satellite.apiKey=${FIELDIOT_SATELLITE_API_KEY:}
# Scheduled pull. Off by default — in LIVE mode this calls the provider once per field per run,
# so making it recurring is a deliberate choice rather than something a deployment inherits.
fieldiot.sync.enabled=${FIELDIOT_SYNC_ENABLED:false}
fieldiot.sync.cron=${FIELDIOT_SYNC_CRON:0 30 5 * * *}

# ── OpenAI-compatible provider (ai.provider=openai-compatible) ────────────────
# Most providers speak the same wire format, so one setting swaps between them. Useful because
# Google AI Studio's free tier caps requests per day per model, and no property here changes a
# quota someone else enforces.
#
#   Groq        OPENAI_COMPAT_BASE_URL=https://api.groq.com/openai
#               OPENAI_COMPAT_MODEL=llama-3.3-70b-versatile
#               OPENAI_COMPAT_API_KEY=<groq key>
#
#   OpenRouter  OPENAI_COMPAT_BASE_URL=https://openrouter.ai/api
#               OPENAI_COMPAT_MODEL=meta-llama/llama-3.3-70b-instruct
#               OPENAI_COMPAT_API_KEY=<openrouter key>
#
#   Ollama      OPENAI_COMPAT_BASE_URL=http://localhost:11434   (no key, no quota, your hardware)
#               OPENAI_COMPAT_MODEL=qwen2.5:7b
#
# Whichever model you pick must support tool calling — the assistant reads ERP data through tools.
openai.compat.base-url=${OPENAI_COMPAT_BASE_URL:http://localhost:11434}
openai.compat.model=${OPENAI_COMPAT_MODEL:qwen2.5:7b}
openai.compat.api-key=${OPENAI_COMPAT_API_KEY:}
openai.compat.max-tokens=${OPENAI_COMPAT_MAX_TOKENS:4096}

# Gemini falls back through these when the configured model is out of quota. The free allowance is
# granted per project PER MODEL, so each one in this list carries its own.
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash,gemini-3.5-flash-lite}

# Demo data for local work only. Never on in a deployed environment.
app.seed.test-data=true
