# ── Railway Production Profile ─────────────────────────────────────────────
# Active via: -Dspring.profiles.active=railway (set in Dockerfile ENTRYPOINT)
# All ${VAR} values are injected as Railway environment variables.

# Port — Railway injects $PORT automatically
server.port=${PORT:8080}

# ── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ────────────────────────────────────────────────────────
# update: creates tables on first deploy, applies schema changes on redeploy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# Controllers serialize JPA entities directly; keep the session open during view
# rendering so lazy @OneToMany collections initialize instead of throwing
# LazyInitializationException (ERR_010) during Jackson serialization.
spring.jpa.open-in-view=true
# Do NOT crash on index-already-exists errors (safe on re-deploy — indexes persist)
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# ── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── Disable H2 ─────────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ── JWT ────────────────────────────────────────────────────────────────────
# Set JWT_SECRET in Railway service variables (must be 256-bit / 32+ chars)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Disable mail health check — SMTP is optional and not configured on Railway
management.health.mail.enabled=false

# ── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── AI Assistant ───────────────────────────────────────────────────────────
# Set these as Railway service variables. For Groq (no daily cap, unlike Google AI Studio's
# twenty-a-day free tier):
#   AI_PROVIDER=openai-compatible
#   OPENAI_COMPAT_BASE_URL=https://api.groq.com/openai
#   OPENAI_COMPAT_API_KEY=<groq key>
# Or GEMINI_API_KEY, or ANTHROPIC_API_KEY + AI_PROVIDER=claude.
ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
openai.compat.base-url=${OPENAI_COMPAT_BASE_URL:}
openai.compat.model=${OPENAI_COMPAT_MODEL:llama-3.3-70b-versatile}
openai.compat.api-key=${OPENAI_COMPAT_API_KEY:}
openai.compat.max-tokens=${OPENAI_COMPAT_MAX_TOKENS:4096}
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
# Silence non-fatal "index/relation already exists" DDL warnings from ddl-auto=update
# on redeploy (indexes persist across restarts; halt_on_error=false already ignores them).
# Genuine schema failures still surface as ERROR.
logging.level.org.hibernate.tool.schema=ERROR

# ── Single Sign-On (OIDC) ─────────────────────────────────────────────────
app.sso.enabled=${SSO_ENABLED:false}
app.sso.auto-provision=${SSO_AUTO_PROVISION:true}
app.sso.require-email-verified=${SSO_REQUIRE_EMAIL_VERIFIED:true}
app.sso.default-role=${SSO_DEFAULT_ROLE:STAFF}
app.sso.default-tenant-id=${SSO_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
app.sso.providers.google.client-id=${SSO_GOOGLE_CLIENT_ID:}
app.sso.providers.google.issuer=${SSO_GOOGLE_ISSUER:https://accounts.google.com}
app.sso.providers.google.jwks-uri=${SSO_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
app.sso.providers.microsoft.client-id=${SSO_MS_CLIENT_ID:}
app.sso.providers.microsoft.issuer=${SSO_MS_ISSUER:}
app.sso.providers.microsoft.jwks-uri=${SSO_MS_JWKS_URI:}

# Demo data seeder stays off: this is a real database.
app.seed.test-data=false
